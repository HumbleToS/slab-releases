<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slab</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div id="background" aria-hidden="true">
      <div id="bg-gradient"></div>
      <video id="bg-video" autoplay loop muted playsinline hidden></video>
      <img id="bg-image" alt="" hidden />
      <div id="bg-shade"></div>
    </div>
    <main id="widgets"></main>
    <div id="settings">
      <section id="settings-card" class="card" hidden></section>
      <button id="settings-toggle" type="button" aria-label="Customize"></button>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
