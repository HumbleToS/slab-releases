<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slab</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/settings.css" />
  </head>
  <body class="settings-page">
    <main id="settings-main">
      <header id="settings-header">
        <h1>Slab <span id="app-version" class="dim"></span></h1>
        <div id="settings-header-right">
          <span id="update-status" class="dim"></span>
          <button id="open-config" type="button">Open config folder</button>
        </div>
      </header>
      <section>
        <h2>Theme</h2>
        <div id="theme-controls"></div>
      </section>
      <section>
        <h2>Widgets</h2>
        <div id="widget-list"></div>
        <div id="widget-add"></div>
        <p class="widget-hint dim">
          Order here is order on the screen. Params (coordinates, labels,
          URIs…) live in config.toml — Open config folder, edit, save, and the
          dashboard updates live.
        </p>
      </section>
      <section>
        <h2>Background</h2>
        <div id="background-grid"></div>
      </section>
    </main>
    <script type="module" src="js/settings.js"></script>
  </body>
</html>
