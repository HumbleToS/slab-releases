[package]
name = "slab-app"
version = "0.1.0"
description = "Slab — touch-first dashboard for the HYTE Y70 Touch case screen"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-log = "2"
toml = "0.8"
toml_edit = "0.22"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "native-tls",
] }
tokio = { version = "1", features = ["macros", "time", "sync"] }
tauri-plugin-autostart = "2"
sysinfo = "0.33"
tauri-plugin-updater = { version = "2", default-features = false, features = [
  "native-tls",
] }
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
